name: Check Anchore tool versions

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Validate pins and check latest stable releases
        run: python3 scripts/anchore_tools.py check-latest
