name: Weekly image refresh — dar-backup

on:
  schedule:
    - cron: '17 4 * * 6'  # Every Saturday at 04:17 UTC
  workflow_dispatch:

concurrency:
  # Shared with release.yml so two jobs cannot race the mutable tag.
  group: dar-backup-dockerhub-publication
  cancel-in-progress: false

permissions:
  contents: write
  security-events: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCKERHUB_REPO: per2jensen/dar-backup
  FINAL_IMAGE_NAME: dar-backup
  UBUNTU_VERSION: 24.04
  ORCHESTRATION_SHA: ${{ github.sha }}

jobs:
  refresh:
    runs-on: ubuntu-24.04

    steps:
      # Orchestration and application source intentionally live in separate
      # trees. The recorded source commit is never overlaid with files from main.
      - name: Require a main-branch run
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "❌ Refreshes must run from main, not ${WORKFLOW_REF}"
            exit 1
          fi

      - name: Checkout immutable orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: orchestration

      - name: Checkout housekeeping tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: housekeeping

      - name: Validate immutable orchestration
        working-directory: orchestration
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [[ "${ACTUAL_SHA}" != "${ORCHESTRATION_SHA}" ]]; then
            echo "❌ Orchestration checkout mismatch"
            echo "   expected: ${ORCHESTRATION_SHA}"
            echo "   actual:   ${ACTUAL_SHA}"
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "❌ Orchestration checkout is not clean"
            git status --short
            exit 1
          fi

      - name: Sanity checks and compute rebuild version
        working-directory: orchestration
        run: |
          set -euo pipefail

          fail() {
            echo "❌ $1"
            exit 1
          }

          SELECTION=$(python3 scripts/select_refresh_source.py \
            --history doc/build-history.json \
            --repository .)
          RAW_TAG=$(jq -er '.raw_tag' <<< "${SELECTION}")
          BASE_TAG=$(jq -er '.base_version' <<< "${SELECTION}")
          REBUILD_VERSION=$(jq -er '.next_refresh_version' <<< "${SELECTION}")
          RECORDED_REVISION=$(jq -er '.recorded_revision' <<< "${SELECTION}")
          APPLICATION_SHA=$(jq -er '.application_sha' <<< "${SELECTION}")
          RELEASE_TAG_SHA=$(jq -er '.release_tag_sha' <<< "${SELECTION}")
          TAG_MATCHES_SOURCE=$(jq -er '.tag_matches_source | tostring' \
            <<< "${SELECTION}")

          if [[ "${TAG_MATCHES_SOURCE}" != "true" ]]; then
            echo "::warning title=Historical release-tag mismatch::v${BASE_TAG} points to ${RELEASE_TAG_SHA}; rebuilding source ${APPLICATION_SHA} recorded by build ${RAW_TAG}"
          fi

          git rev-parse "v${REBUILD_VERSION}" >/dev/null 2>&1 \
            && fail "Git tag v${REBUILD_VERSION} already exists"

          echo "BASE_TAG=${BASE_TAG}" >> "${GITHUB_ENV}"
          echo "REBUILD_VERSION=${REBUILD_VERSION}" >> "${GITHUB_ENV}"
          echo "RECORDED_REVISION=${RECORDED_REVISION}" >> "${GITHUB_ENV}"
          echo "APPLICATION_SHA=${APPLICATION_SHA}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG_SHA=${RELEASE_TAG_SHA}" >> "${GITHUB_ENV}"
          echo "TAG_MATCHES_SOURCE=${TAG_MATCHES_SOURCE}" >> "${GITHUB_ENV}"
          echo "✅ Rebuilding recorded source ${APPLICATION_SHA} as ${REBUILD_VERSION}"

      - name: Require unused Docker Hub refresh tag
        working-directory: orchestration
        run: |
          scripts/verify_docker_tag_available.sh \
            "${DOCKERHUB_REPO}" \
            "${REBUILD_VERSION}"

      - name: Checkout immutable application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.APPLICATION_SHA }}
          fetch-depth: 0
          path: source

      - name: Validate immutable application source
        working-directory: source
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [[ "${ACTUAL_SHA}" != "${APPLICATION_SHA}" ]]; then
            echo "❌ Application checkout does not match recorded source"
            echo "   expected: ${APPLICATION_SHA}"
            echo "   actual:   ${ACTUAL_SHA}"
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "❌ Application checkout is not clean"
            git status --short
            exit 1
          fi
          echo "✅ Application source locked to recorded commit ${APPLICATION_SHA}"

      - name: Set artifact filenames
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          echo "SBOM_FILE=doc/sbom/sbom-${{ env.FINAL_IMAGE_NAME }}-${{ env.REBUILD_VERSION }}-${TIMESTAMP}.cyclonedx.json" >> "${GITHUB_ENV}"
          echo "SARIF_FILE=doc/sarif/grype-${{ env.FINAL_IMAGE_NAME }}-${{ env.REBUILD_VERSION }}-${TIMESTAMP}.sarif" >> "${GITHUB_ENV}"
          echo "TIMESTAMP=${TIMESTAMP}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: sudo apt-get install -y python3-pytest

      - name: Install pinned Syft and Grype
        working-directory: orchestration
        run: sudo python3 scripts/anchore_tools.py install --bin-dir /usr/local/bin

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Test orchestration publisher
        working-directory: orchestration
        run: |
          python3 -m pytest -q \
            tests/test_commit_refresh_housekeeping.py \
            tests/test_finalize_refresh_image.py \
            tests/test_grype_sarif_summary.py \
            tests/test_publish_image.py \
            tests/test_select_refresh_source.py \
            tests/test_validate_image_version.py \
            tests/test_refresh_image_guards.py \
            tests/test_verify_image_license.py

      - name: Read version pins
        id: versions
        working-directory: source
        run: |
          echo "DAR_BACKUP_VERSION=$(cat DAR_BACKUP_VERSION)" >> "${GITHUB_OUTPUT}"
          echo "DAR_VERSION=$(cat DAR_VERSION)" >> "${GITHUB_OUTPUT}"

      - name: Read Grype version
        id: tools
        working-directory: orchestration
        run: |
          source config/anchore-tool-versions.env
          echo "GRYPE_VERSION=${GRYPE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build dev image
        working-directory: source
        run: |
          make \
            FINAL_VERSION=dev \
            DAR_BACKUP_VERSION=${{ steps.versions.outputs.DAR_BACKUP_VERSION }} \
            DAR_VERSION=${{ steps.versions.outputs.DAR_VERSION }} \
            dev

      - name: Test dev image
        working-directory: source
        run: |
          make \
            FINAL_VERSION=dev \
            DAR_BACKUP_VERSION=${{ steps.versions.outputs.DAR_BACKUP_VERSION }} \
            DAR_VERSION=${{ steps.versions.outputs.DAR_VERSION }} \
            test

      - name: Create final image
        run: |
          orchestration/scripts/finalize_refresh_image.sh \
            source \
            "${BASE_TAG}" \
            "${REBUILD_VERSION}" \
            "${{ steps.versions.outputs.DAR_BACKUP_VERSION }}" \
            "${{ steps.versions.outputs.DAR_VERSION }}"

      - name: Verify CLI version
        working-directory: source
        run: |
          make \
            FINAL_VERSION=${{ env.REBUILD_VERSION }} \
            DAR_BACKUP_VERSION=${{ steps.versions.outputs.DAR_BACKUP_VERSION }} \
            verify-cli-version

      - name: Verify OCI labels
        working-directory: source
        run: make FINAL_VERSION=${{ env.REBUILD_VERSION }} verify-labels

      - name: Verify exact application revision label
        run: |
          orchestration/scripts/verify_image_revision.sh \
            "${FINAL_IMAGE_NAME}:${REBUILD_VERSION}" \
            "${APPLICATION_SHA}"

      - name: Verify embedded LICENSE SHA-256
        run: |
          orchestration/scripts/verify_image_license.sh \
            "${FINAL_IMAGE_NAME}:${REBUILD_VERSION}" \
            "3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986"

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "${GITHUB_OUTPUT}"

      - name: Cache Grype DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ runner.os }}-${{ steps.tools.outputs.GRYPE_VERSION }}-${{ steps.date.outputs.date }}
          restore-keys: |
            grype-db-${{ runner.os }}-${{ steps.tools.outputs.GRYPE_VERSION }}-

      - name: Generate SBOM with Syft
        working-directory: source
        run: |
          SYFT_CHECK_FOR_APP_UPDATE=false \
            syft "docker:${{ env.FINAL_IMAGE_NAME }}:${{ env.REBUILD_VERSION }}" \
              -o cyclonedx-json > "${{ env.SBOM_FILE }}"

      - name: Scan image with Grype
        working-directory: source
        run: |
          GRYPE_CHECK_FOR_APP_UPDATE=false \
            grype "sbom:${{ env.SBOM_FILE }}" \
              --fail-on high \
              --add-cpes-if-none \
              -o sarif > "${{ env.SARIF_FILE }}"

      - name: Upload Grype SARIF to GitHub Security tab
        if: ${{ always() && env.SARIF_FILE != '' && hashFiles(format('source/{0}', env.SARIF_FILE)) != '' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: source/${{ env.SARIF_FILE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Grype SARIF as Actions artifact
        if: ${{ always() && env.SARIF_FILE != '' && hashFiles(format('source/{0}', env.SARIF_FILE)) != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grype-report-${{ env.REBUILD_VERSION }}
          path: source/${{ env.SARIF_FILE }}

      - name: Revalidate immutable inputs before publication
        run: |
          if [[ "$(git -C source rev-parse HEAD)" != "${APPLICATION_SHA}" ]]; then
            echo "❌ Application source commit changed before publication"
            exit 1
          fi
          if ! git -C source diff --quiet || ! git -C source diff --cached --quiet; then
            echo "❌ Tracked application source changed before publication"
            exit 1
          fi
          git -C orchestration fetch origin main
          REMOTE_MAIN_SHA=$(git -C orchestration rev-parse refs/remotes/origin/main)
          if [[ "${REMOTE_MAIN_SHA}" != "${ORCHESTRATION_SHA}" ]]; then
            echo "❌ main advanced after refresh orchestration was selected"
            exit 1
          fi

      - name: Publish, sign, and verify image
        id: publish_image
        uses: ./orchestration/.github/actions/publish-image
        with:
          local-image: ${{ env.FINAL_IMAGE_NAME }}:${{ env.REBUILD_VERSION }}
          repository: ${{ env.DOCKERHUB_REPO }}
          version: ${{ env.REBUILD_VERSION }}
          expected-cli-version: ${{ steps.versions.outputs.DAR_BACKUP_VERSION }}
          sbom-file: source/${{ env.SBOM_FILE }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USER_NAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Housekeeping — build log, badge, and git tag
        working-directory: housekeeping
        run: |
          git fetch origin main
          REMOTE_MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          if [[ "${REMOTE_MAIN_SHA}" != "${ORCHESTRATION_SHA}" ]]; then
            echo "❌ main advanced after Docker publication"
            echo "   orchestration: ${ORCHESTRATION_SHA}"
            echo "   current main:  ${REMOTE_MAIN_SHA}"
            exit 1
          fi

          install -D -m 0644 "../source/${{ env.SBOM_FILE }}" "${{ env.SBOM_FILE }}"
          install -D -m 0644 "../source/${{ env.SARIF_FILE }}" "${{ env.SARIF_FILE }}"

          DIGEST="${{ steps.publish_image.outputs.digest }}"
          BUILD_NUMBER=$(jq length doc/build-history.json 2>/dev/null || echo 0)
          IMAGE_ID=$(docker inspect --format '{{ .Id }}' \
            ${{ env.FINAL_IMAGE_NAME }}:${{ env.REBUILD_VERSION }})
          BASE_IMAGE_DIGEST=$(docker inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' \
            ${{ env.FINAL_IMAGE_NAME }}:${{ env.REBUILD_VERSION }})

          export PYTHONPATH="${PYTHONPATH:-}:scripts"
          python3 scripts/update_build_log.py \
            --dar-backup-version "${{ steps.versions.outputs.DAR_BACKUP_VERSION }}" \
            --dar-version "${{ steps.versions.outputs.DAR_VERSION }}" \
            --log doc/build-history.json \
            --build-number "${BUILD_NUMBER}" \
            --version "${{ env.REBUILD_VERSION }}" \
            --base "ubuntu:${{ env.UBUNTU_VERSION }}" \
            --base-image-digest "${BASE_IMAGE_DIGEST}" \
            --git-rev "${APPLICATION_SHA}" \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --url "https://hub.docker.com/layers/${{ env.DOCKERHUB_REPO }}/${{ env.REBUILD_VERSION }}/images/${DIGEST#*@}" \
            --digest "${DIGEST#*@}" \
            --image-id "${IMAGE_ID}" \
            --grype-sarif "${{ env.SARIF_FILE }}" \
            --sbom-file "${{ env.SBOM_FILE }}" \
            --sbom-release-asset-url "no release asset - scheduled image refresh" \
            --cosign-signed "true" \
            --cosign-rekor-url "${{ steps.publish_image.outputs.rekor_url }}" \
            --cosign-image-digest "${DIGEST}" \
            --build-runner "${{ runner.os }}-${{ runner.arch }}" \
            --github-run-id "${{ github.run_id }}" \
            --github-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          python3 scripts/write_cosign_badge.py
          scripts/commit_refresh_housekeeping.sh \
            "${{ env.REBUILD_VERSION }}" \
            "${APPLICATION_SHA}" \
            "${DIGEST}" \
            doc/build-history.json \
            "${{ env.SARIF_FILE }}" \
            "${{ env.SBOM_FILE }}" \
            doc/cosign_badge.json

      - name: Write failure badge
        if: failure() && steps.publish_image.outcome == 'failure'
        working-directory: housekeeping
        run: |
          scripts/publish_cosign_badge.sh \
            failed \
            "cosign badge: refresh ${REBUILD_VERSION:-unknown} failed (run ${{ github.run_id }})"

      - name: Post summary
        working-directory: housekeeping
        run: |
          SARIF="${{ env.SARIF_FILE }}"
          source <(python3 scripts/grype_summary_env.py "${SARIF}")

          echo "## ✅ dar-backup Weekly Refresh v${{ env.REBUILD_VERSION }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Field | Value |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|-------|-------|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Docker image | \`${{ env.DOCKERHUB_REPO }}:${{ env.REBUILD_VERSION }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Also pushed as | \`${{ env.DOCKERHUB_REPO }}:latest\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Image digest | \`${{ steps.publish_image.outputs.digest }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Application source | \`${APPLICATION_SHA}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Recorded revision | \`${RECORDED_REVISION}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Orchestration source | \`${ORCHESTRATION_SHA}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Base release | \`${{ env.BASE_TAG }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Base tag matches source | \`${TAG_MATCHES_SOURCE}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| dar-backup version | \`${{ steps.versions.outputs.DAR_BACKUP_VERSION }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Cosign signed | ✅ keyless (Sigstore / Rekor) |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Rekor entry | ${{ steps.publish_image.outputs.rekor_url }} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "### Grype vulnerability scan" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Severity | Count |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|----------|-------|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| 🔴 Critical | \`${CRITICAL}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| 🟠 High | \`${HIGH}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| 🟡 Medium | \`${MEDIUM}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| 🔵 Low | \`${LOW}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| ⚪ Negligible | \`${NEGLIGIBLE}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| 🔔 Warning | \`${WARNING}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| 📝 Note | \`${NOTE}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "### Verify the signature" >> "${GITHUB_STEP_SUMMARY}"
          echo '```bash' >> "${GITHUB_STEP_SUMMARY}"
          echo "cosign verify ${{ env.DOCKERHUB_REPO }}:${{ env.REBUILD_VERSION }} \\" >> "${GITHUB_STEP_SUMMARY}"
          echo '  --certificate-identity-regexp="^https://github\.com/${{ github.repository }}/\.github/workflows/(release|image-refresh)\.yml@refs/heads/main$" \' >> "${GITHUB_STEP_SUMMARY}"
          echo '  --certificate-oidc-issuer="https://token.actions.githubusercontent.com"' >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
