name: License compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate repository-specific headers
        run: python3 scripts/validate_license_headers.py

      - name: Validate REUSE compliance
        uses: fsfe/reuse-action@v6
